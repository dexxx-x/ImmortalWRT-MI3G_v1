name: Build ImmortalWrt for Xiaomi Mi 3G (PassWall2 Xray Only)

on:
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libssl-dev python3 python3-pip rsync swig unzip zlib1g-dev \
            p7zip-full subversion device-tree-compiler uglifyjs upx-ucl

      - name: Clone ImmortalWrt source
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git -b openwrt-24.10 openwrt
          cd openwrt

      - name: Update feeds and add PassWall2 feed
        run: |
          cd openwrt
          # Добавляем фид PassWall (важно: используем ветку main для актуальных зависимостей)
          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default
          echo "src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> feeds.conf.default
          
          # Обновляем и устанавливаем все фиды
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Customize configuration (.config)
        run: |
          cd openwrt
          
          # 1. Базовая конфигурация для Xiaomi Mi Router 3G (ramips/mt7621)
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y" >> .config
          
          # 2. Замена dnsmasq на dnsmasq-full (требуется для PassWall)
          # Отключаем стандартный dnsmasq
          echo "CONFIG_PACKAGE_dnsmasq=n" >> .config
          # Включаем full версию
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          
          # 3. Включаем PassWall2
          echo "CONFIG_PACKAGE_luci-app-passwall2=y" >> .config
          
          # 4. Отключаем Sing-box (чтобы не грузить процессор)
          echo "CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_SingBox=n" >> .config
          echo "CONFIG_PACKAGE_sing-box=n" >> .config
          
          # 5. Включаем только Xray
          echo "CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Xray=y" >> .config
          echo "CONFIG_PACKAGE_xray-core=y" >> .config
          
          # 6. Дополнительные полезные пакеты (опционально, но часто нужны для PW2)
          echo "CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Libev_Client=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Simple_Obfs=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_V2ray_Plugin=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y" >> .config
          
          # 7. Ставим галку на полную сборку (чтобы не было интерактивных запросов)
          make defconfig

      - name: Download dependencies
        run: |
          cd openwrt
          make download -j8

      - name: Compile the firmware
        run: |
          cd openwrt
          # Используем -j1 для стабильности на бесплатных раннерах, либо -j$(nproc) для скорости
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-Xiaomi-Mi3G-PassWall2-Xray
          path: openwrt/bin/targets/ramips/mt7621/*.bin
