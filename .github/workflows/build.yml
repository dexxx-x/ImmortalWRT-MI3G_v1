name: Build ImmortalWrt Mi3G with PassWall2 (Xray only)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
          python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
          unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone source code
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Add PassWall2 feeds
        run: |
          cd openwrt
          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default
          echo "src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main" >> feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add uci-defaults (Wi-Fi + PassWall2 fixes)
        run: |
          # Создаём директорию ОДИН раз и до записи файлов
          mkdir -p openwrt/files/etc/uci-defaults

          # --- 1. Wi-Fi включён по умолчанию, без пароля ---
          cat << 'EOF' > openwrt/files/etc/uci-defaults/99-custom-wifi
          #!/bin/sh
          uci set wireless.radio0.disabled=0
          uci set wireless.radio1.disabled=0
          uci set wireless.default_radio0.encryption='none'
          uci set wireless.default_radio1.encryption='none'
          uci commit wireless
          exit 0
          EOF

          # --- 2. Фиксы PassWall2 (fw4, DNS, WAN, проброс портов) ---
          cat << 'EOF' > openwrt/files/etc/uci-defaults/99-fix-passwall-fw4
          #!/bin/sh

          # (A) Удаляем legacy-секции passwall из firewall — они ломают fw4
          uci delete firewall.passwall2 2>/dev/null
          uci delete firewall.passwall2_server 2>/dev/null
          uci commit firewall 2>/dev/null

          # (B) Переключаем DNS-интеграцию PassWall2 с ipset на nftset
          uci set passwall2.@global[0].write_ipset_direct='0' 2>/dev/null
          uci set passwall2.@global[0].write_nftset_direct='1' 2>/dev/null
          uci set passwall2.@global[0].remote_dns='8.8.4.4' 2>/dev/null
          uci commit passwall2 2>/dev/null

          # (C) Жёсткий DNS на WAN — защита от утечек и конфликтов с PassWall2
          uci set network.wan.peerdns='0'
          uci set network.wan6.peerdns='0'
          uci set network.wan.dns='1.1.1.1'
          uci set network.wan6.dns='2606:4700:4700::1111'
          uci commit network

          # (D) Прозрачный прокси: пробрасываем ВСЕ порты TCP/UDP без исключений
          uci set passwall2.@global_forwarding[0].tcp_no_redir_ports='disable'
          uci set passwall2.@global_forwarding[0].udp_no_redir_ports='disable'
          uci set passwall2.@global_forwarding[0].tcp_redir_ports='1:65535'
          uci set passwall2.@global_forwarding[0].udp_redir_ports='1:65535'
          uci commit passwall2

          exit 0
          EOF

          # Делаем скрипты исполняемыми
          chmod +x openwrt/files/etc/uci-defaults/99-custom-wifi
          chmod +x openwrt/files/etc/uci-defaults/99-fix-passwall-fw4

      - name: Generate .config for Xiaomi Mi Router 3G v1
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=512

          # LuCI (английский по умолчанию, без языковых пакетов)
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_uhttpd=y

          # Замена dnsmasq на dnsmasq-full (обязательно для PassWall2)
          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_dnsmasq-full=y

          # PassWall2 — только Xray, sing-box исключён
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_SingBox=n
          CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Xray=y
          CONFIG_PACKAGE_sing-box=n
          CONFIG_PACKAGE_xray-core=y

          # Модули ядра для nftables/TPROXY (обязательны для fw4)
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-tun=y

          # Зависимости PassWall2
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y

          # Полезные утилиты
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ca-bundle=y
          EOF
          make defconfig

      - name: Verify critical packages are present in .config
        run: |
          cd openwrt
          echo "=== Checking critical options ==="
          for opt in \
            CONFIG_PACKAGE_dnsmasq-full=y \
            CONFIG_PACKAGE_luci-app-passwall2=y \
            CONFIG_PACKAGE_xray-core=y \
            CONFIG_PACKAGE_kmod-nft-tproxy=y \
            CONFIG_PACKAGE_kmod-nft-socket=y \
            CONFIG_PACKAGE_kmod-nft-nat=y \
            CONFIG_PACKAGE_kmod-tun=y ; do
            if grep -q "^$opt" .config; then
              echo "OK: $opt"
            else
              echo "MISSING: $opt"; exit 1
            fi
          done
          echo "=== Checking that sing-box is disabled ==="
          if grep -q "^CONFIG_PACKAGE_sing-box=y" .config; then
            echo "ERROR: sing-box is enabled!"; exit 1
          else
            echo "OK: sing-box is not enabled"
          fi

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Organize files
        id: organize
        run: |
          mkdir -p firmware
          cp openwrt/bin/targets/ramips/mt7621/*xiaomi_mi-router-3g* firmware/
          echo "FIRMWARE_DIR=$(pwd)/firmware" >> $GITHUB_ENV

      - name: Upload firmware to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-Xiaomi-Mi3G-PassWall2-Xray
          path: ${{ env.FIRMWARE_DIR }}/*
          retention-days: 30
